[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arcvisual"
version = "0.1.0"
description = "Paper in. Explained paper out."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }

# The control plane deliberately does NOT depend on manim. It has to run in a
# small, fast-starting container; only the render workers pay for the multi-GB
# image. Everything Manim-specific is imported lazily behind
# arcvisual.templates.base.manim_mod().
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pyyaml>=6.0",
  "ruff>=0.6",
]

[project.optional-dependencies]
# The render container. Versions are pinned exactly: the plan's mitigation for
# "Manim CE version drift breaking templates" is a pin plus render-snapshot
# tests, and a floating version defeats both.
render = [
  "manim==0.18.1",
  "manim-ml==0.0.24",
  "manim-physics==0.4.0",
  "manim-dsa==0.2.0",
]
api = [
  "fastapi[standard]>=0.115",
  "psycopg[binary]>=3.1",
  "boto3>=1.34",
]
llm = ["anthropic>=0.40"]
compute = ["modal>=0.64"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  # Static ffmpeg binary so the render tests need no system package.
  "imageio-ffmpeg>=0.5",
]
all = ["arcvisual[render,api,llm,compute,dev]"]

[project.scripts]
arcvisual-eval = "eval.run:main"

[tool.hatch.build.targets.wheel]
packages = ["arcvisual"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Render tests are minutes each and need Manim; opt in with `-m slow`.
addopts = "-q --strict-markers -m 'not slow'"
markers = [
  "slow: renders real video; needs Manim CE and ffmpeg",
]
filterwarnings = ["error::DeprecationWarning:arcvisual.*"]

[tool.ruff]
line-length = 90
target-version = "py311"
extend-exclude = ["arcvisual/db/migrations/versions", "eval-out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",    # line length is handled by the formatter
  "B008",    # FastAPI's Depends() in defaults is the documented idiom
  "SIM108",  # ternaries are not always clearer
  "RUF012",  # ClassVar annotations on mutable class attrs add noise here
  # `class X(str, Enum)` over StrEnum: these values are serialised into the
  # Storyboard JSON and stored in Postgres, and StrEnum changes what `str(x)`
  # yields. Not worth a behaviour change for a style rule.
  "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117", "C408", "RUF001"]
# Templates read as Manim scripts on purpose; matching upstream idiom beats
# matching our own lint preferences.
"arcvisual/templates/*.py" = ["C4", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
# manim, modal and anthropic are optional at type-check time for the same reason
# they are optional at runtime.
disable_error_code = ["import-not-found"]
exclude = "arcvisual/db/migrations/"
